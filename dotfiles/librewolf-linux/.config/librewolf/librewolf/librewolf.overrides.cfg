// tab bar on left (vertical tabs) & hide bookmarks bar
defaultPref("sidebar.verticalTabs", true);
defaultPref("browser.toolbars.bookmarks.visibility", "never");

// preserve history & restore previous tabs on startup
defaultPref("browser.startup.page", 3);
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);

// web compatibility (disable RFP to restore dark mode & native canvas, keep lightweight protection)
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);

// enable WebGL without permission prompts
defaultPref("webgl.disabled", false);
defaultPref("librewolf.webgl.prompt", false);

// DRM media playback (Netflix, Spotify, etc)
defaultPref("media.eme.enabled", true);
defaultPref("media.gmp-widevinecdm.enabled", true);
defaultPref("media.gmp-gmpopenh264.enabled", true);

// Firefox Sync
defaultPref("identity.fxaccounts.enabled", true);

// form autofill
defaultPref("dom.forms.autocomplete.formautofill", true);
