schema: 1

system:
  distro: auto
  desktop: auto
  ensure_admin: true
  apt:
    sources: managed
    components:
      - main
    unattended_upgrades: false
  ubuntu:
    snap: false
    codecs: true

packages:
  remove:
    - docker.io
  apt:
    - curl
    - git
    - stow
  repositories:
    - name: github-cli
      key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      source:
        urls:
          default: https://cli.github.com/packages
        suite: stable
        components:
          - main
      packages:
        - gh
  flatpak:
    - com.bitwarden.desktop
  cargo:
    - bat
    - starship
  npm:
    - opencode-ai
  direct:
    - name: obsidian
      format: appimage
      provides:
        - obsidian
      source:
        type: github
        repository: obsidianmd/obsidian-releases
        assets:
          amd64:
            include: "Obsidian-*.AppImage"
            exclude:
              - "Obsidian-*-arm64.AppImage"
          arm64:
            include: "Obsidian-*-arm64.AppImage"
            exclude: []

tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"

fonts:
  nerd:
    - GeistMono

dotfiles:
  packages:
    - bash
    - starship

integrations:
  docker:
    add_user_to_group: true
    local_log_driver: true
    max_log_size: 10m
  virtualbox:
    add_user_to_group: true
  vscode:
    extensions:
      - rust-lang.rust-analyzer

desktop:
  theme: dark
  terminal: wezterm
  idle:
    timeout: 15m
    dim: false
  gnome:
    extensions:
      - blur-my-shell@aunetx
    dock: true
    rounded_corners: true

updates:
  apt: standard
  flatpak: true
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
    direct: true
