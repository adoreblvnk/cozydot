[package]
name = "cozydot"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Declarative Linux post-install, update, and dotfile manager"
license = "MIT"
repository = "https://github.com/adoreblvnk/cozydot"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
