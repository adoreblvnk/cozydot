[package]
name = "cozydot"
version = "0.4.2"
edition = "2024"
description = "Declarative system setup & dotfile manager for Linux & macOS"
license = "MIT"
repository = "https://github.com/adoreblvnk/cozydot"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
etc-os-release = "0.1.1"
humantime = "2"
regex = "1"
rust-embed = { version = "8", features = ["debug-embed"] }
rustix = { version = "1.1", features = ["process", "system"] }
same-file = "1"
self_update = { version = "1", features = ["checksums"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
walkdir = "2"
yaml_serde = "0.10.7"

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", default-features = false }
