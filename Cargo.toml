[package]
name = "cozydot"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Declarative Linux post-install, update, and dotfile manager"
license = "MIT"
repository = "https://github.com/adoreblvnk/cozydot"

[dependencies]
anyhow = "1"
flate2 = "1"
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
