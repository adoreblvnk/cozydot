[package]
name = "cozydot"
version = "1.0.0"
edition = "2024"
description = "Declarative Linux and macOS post-install, update, and dotfile manager"
license = "MIT"
repository = "https://github.com/adoreblvnk/cozydot"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
humantime = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10.7"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
regex = "1"
rust-embed = { version = "8", features = ["debug-embed"] }
rustix = { version = "1.1", features = ["process", "system"] }
etc-os-release = "0.1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", default-features = false }
