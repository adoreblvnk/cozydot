[package]
name = "cozydot"
version = "1.0.0"
edition = "2024"
description = "Declarative Linux and macOS post-install, update, and dotfile manager"
license = "MIT"
repository = "https://github.com/adoreblvnk/cozydot"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
yaml_serde = "0.10"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
regex = "1"
rustix = { version = "1.1", features = ["process"] }
etc-os-release = "0.1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", default-features = false }
