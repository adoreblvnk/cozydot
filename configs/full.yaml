# Proposed cross-platform configuration. The current 1.0.0 schema does not parse this file yet.
version: 1.0.0

shared:
  tools:
    rust: stable
    go: latest
    node: lts
    python: "3.13"

  packages:
    cargo:
      - bat
      - bottom
      - du-dust
      - eza
      - fd-find
      - presenterm
      - starship
      - tealdeer
      - yazi-fm
      - zoxide
    npm:
      - "@playwright/cli"
      - opencode-ai
      - skills

  fonts:
    nerd:
      - GeistMono

  dotfiles:
    packages:
      - bat
      - bin
      - bottom
      - fastfetch
      - git
      - gnupg
      - opencode
      - starship
      - vscode
      - wezterm
      - yazi

  integrations:
    vscode:
      extensions:
        - catppuccin.catppuccin-vsc
        - charliermarsh.ruff
        - christian-kohler.path-intellisense
        - eamodio.gitlens
        - ecmel.vscode-html-css
        - foxundermoon.shell-format
        - golang.go
        - llvm-vs-code-extensions.vscode-clangd
        - ms-python.debugpy
        - ms-python.python
        - ms-python.vscode-pylance
        - prettier.prettier-vscode
        - redhat.vscode-yaml
        - rust-lang.rust-analyzer
        - streetsidesoftware.code-spell-checker
        - timonwong.shellcheck
        - wayou.vscode-todo-highlight
        - yzhang.markdown-all-in-one

  updates:
    tools:
      rust: true
      go: true
      node: true
      python: true
    packages:
      cargo: true
      npm: true
    fonts: true

os:
  linux:
    system:
      ensure_admin: true
      require:
        distros:
          - ubuntu
          - debian
          - pop
          - linuxmint
        desktops:
          - gnome
          - cinnamon
      apt:
        sources:
          mode: preserve
        unattended_upgrades: disabled
      ubuntu:
        snap: disabled
        codecs: true

    packages:
      apt:
        install:
          - bash-completion
          - build-essential
          - cmake
          - curl
          - default-jdk
          - ffmpeg
          - figlet
          - fzf
          - git
          - imagemagick
          - lolcat
          - openssh-server
          - pandoc
          - pass
          - pinentry-tty
          - trash-cli
          - ttf-mscorefonts-installer
          - unzip
          - vim
          - vlc
          - xz-utils
        repositories:
          - name: docker
            key: https://download.docker.com/linux/ubuntu/gpg
            key_path: /etc/apt/keyrings/docker.asc
            urls:
              ubuntu: https://download.docker.com/linux/ubuntu
              debian: https://download.docker.com/linux/debian
            suite: system
            components:
              - stable
            conflicts:
              default:
                - docker.io
                - docker-compose
                - docker-compose-v2
                - docker-doc
                - podman-docker
                - containerd
                - runc
            packages:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
          - name: github-cli
            key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            urls:
              default: https://cli.github.com/packages
            suite: stable
            components:
              - main
            packages:
              - gh
          - name: helium
            key: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
            key_path: /usr/share/keyrings/helium.gpg
            urls:
              default: https://pkg.helium.computer/deb
            suite: stable
            components:
              - main
            packages:
              - helium-bin
          - name: onlyoffice
            key: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
            key_path: /usr/share/keyrings/onlyoffice.gpg
            urls:
              default: https://download.onlyoffice.com/repo/debian
            suite: squeeze
            components:
              - main
            packages:
              - onlyoffice-desktopeditors
          - name: virtualbox
            key: https://www.virtualbox.org/download/oracle_vbox_2016.asc
            key_path: /usr/share/keyrings/oracle-virtualbox-2016.asc
            urls:
              default: https://download.virtualbox.org/virtualbox/debian
            suite: system
            components:
              - contrib
            packages:
              - virtualbox-7.1
          - name: vscode
            key: https://packages.microsoft.com/keys/microsoft.asc
            key_path: /etc/apt/keyrings/packages.microsoft.gpg
            urls:
              default: https://packages.microsoft.com/repos/code
            suite: stable
            components:
              - main
            packages:
              - code
          - name: wezterm
            key: https://apt.fury.io/wez/gpg.key
            key_path: /usr/share/keyrings/wezterm-fury.asc
            urls:
              default: https://apt.fury.io/wez/
            suite: "*"
            components:
              - "*"
            packages:
              - wezterm-nightly

      flatpak:
        - com.bitwarden.desktop
        - com.discordapp.Discord
        - com.obsproject.Studio
        - io.bassi.Amberol
        - net.sapples.LiveCaptions
        - org.gimp.GIMP
        - org.qbittorrent.qBittorrent
        - org.shotcut.Shotcut
        - org.telegram.desktop

      binaries:
        - name: drawio
          format: deb
          source:
            provider: github
            repository: jgraph/drawio-desktop
            assets:
              amd64: ^drawio-amd64-.*\.deb$
              arm64: ^drawio-arm64-.*\.deb$
        - name: fastfetch
          format: deb
          source:
            provider: github
            repository: fastfetch-cli/fastfetch
            assets:
              amd64: ^fastfetch-linux-amd64\.deb$
              arm64: ^fastfetch-linux-aarch64\.deb$
              arm32: ^fastfetch-linux-armv7l.*\.deb$
        - name: git-credential-manager
          format: deb
          source:
            provider: github
            repository: git-ecosystem/git-credential-manager
            assets:
              amd64: ^gcm-linux-x64-.*\.deb$
              arm64: ^gcm-linux-arm64-.*\.deb$
        - name: obsidian
          format: appimage
          source:
            provider: github
            repository: obsidianmd/obsidian-releases
            assets:
              amd64: ^Obsidian-[0-9]+(?:\.[0-9]+)+\.AppImage$
              arm64: ^Obsidian-[0-9]+(?:\.[0-9]+)+-arm64\.AppImage$
        - name: zen-browser
          format: appimage
          source:
            provider: github
            repository: zen-browser/desktop
            assets:
              amd64: ^zen-x86_6[0-9]\.AppImage$
              arm64: ^zen-aarch6[0-9]\.AppImage$

    dotfiles:
      packages:
        - bash

    integrations:
      appimaged: true
      docker:
        add_user_to_group: true
        logging:
          driver: local
          max_size: 10m
      virtualbox:
        add_user_to_group: true

    desktop:
      theme: dark
      terminal: wezterm
      idle:
        timeout: 15m
        dim: false
      gnome:
        extensions:
          - blur-my-shell@aunetx
          - netspeedsimplified@prateekmedia.extension
        dock: true
        rounded_corners: true

    updates:
      apt: full
      flatpak: true

  macos:
    system:
      ensure_admin: true
      xcode:
        command_line_tools: true
      rosetta: false

    homebrew:
      formulae:
        - cmake
        - ffmpeg
        - fastfetch
        - figlet
        - fzf
        - gh
        - git
        - imagemagick
        - lolcat
        - openjdk
        - pandoc
        - pass
        - pinentry-mac
        - stow
        - trash
        - vim
      casks:
        - bitwarden
        - discord
        - docker
        - drawio
        - gimp
        - git-credential-manager
        - helium-browser
        - obs
        - obsidian
        - onlyoffice
        - qbittorrent
        - shotcut
        - telegram
        - virtualbox
        - visual-studio-code
        - vlc
        - wezterm
        - zen

    dotfiles:
      packages:
        - zsh

    desktop:
      appearance: dark
      dock:
        autohide: true
        show_recent_applications: false
      finder:
        show_filename_extensions: true
        show_hidden_files: true
      keyboard:
        key_repeat: 2
        initial_key_repeat: 15
      trackpad:
        tap_to_click: true

    updates:
      homebrew:
        formulae: true
        casks: true
