version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    xcode:
      command_line_tools: true
packages:
  homebrew:
    formulae:
      - bat
      - bottom
      - can1357/tap/omp
      - cmake
      - dust
      - eza
      - fastfetch
      - fd
      - fzf
      - gh
      - jq
      - opencode
      - oxfmt
      - oxlint
      - panache
      - presenterm
      - resvg
      - sevenzip
      - shfmt
      - starship
      - tlrc
      - tokei
      - yazi
      - yq
      - zoxide
    casks:
      - gimp
      - localsend
      - obsidian
      - onlyoffice
      - recordly
      - shotcut
  linux:
    apt:
      install:
        - bash-completion
        - default-jdk
        - ffmpeg
        - imagemagick
        - openssh-server
        - pinentry-tty
        - qbittorrent
        - qemu-system
        - vim
        - virt-manager
        - wl-clipboard
      repos:
        - name: docker
          key_url: https://download.docker.com/linux/ubuntu/gpg
          key_path: /etc/apt/keyrings/docker.asc
          uris:
            ubuntu: https://download.docker.com/linux/ubuntu
            debian: https://download.docker.com/linux/debian
          suite: codename
          components:
            - stable
          conflicts:
            - docker.io
            - docker-compose
            - docker-compose-v2
            - docker-doc
            - docker-buildx
            - podman-docker
            - containerd
            - runc
          packages:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
        - name: helium
          key_url: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
          key_path: /usr/share/keyrings/helium.gpg
          uris:
            default: https://pkg.helium.computer/deb
          suite: stable
          components:
            - main
          packages:
            - helium-bin
        - name: librewolf
          key_url: https://repo.librewolf.net/pubkey.gpg
          key_path: /etc/apt/keyrings/librewolf.gpg
          uris:
            default: https://repo.librewolf.net
          suite: librewolf
          components:
            - main
          conflicts:
            - firefox
            - firefox-esr
          packages:
            - librewolf
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          uris:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          uris:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly
    flatpak:
      - com.discordapp.Discord
      - com.obsproject.Studio
      - net.sapples.LiveCaptions
      - org.telegram.desktop
    binaries:
      - name: bitwarden
        format: deb
        urls:
          x86_64: https://github.com/bitwarden/clients/releases/download/desktop-v2026.10.0/Bitwarden-2026.10.0-amd64.deb
      - name: git-credential-manager
        format: deb
        urls:
          x86_64: https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.9.1/gcm-linux-x64-2.9.1.deb
          aarch64: https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.9.1/gcm-linux-arm64-2.9.1.deb
  macos:
    homebrew:
      formulae:
        - ffmpeg
        - imagemagick
        - openjdk
        - pass
        - vim
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - bitwarden
        - discord
        - git-credential-manager
        - helium-browser
        - librewolf
        - obs
        - orbstack
        - qbittorrent
        - syntax-highlight
        - telegram
        - utm
        - visual-studio-code
        - wezterm@nightly
tools:
  rust: stable
  node: lts
  python: "3"
  go: latest
  npm:
    - "@slidev/cli"
    - firecrawl-cli
    - skills
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - bottom
      - fastfetch
      - gnupg
      - opencode
      - starship
      - wezterm
      - yazi
    linux:
      - bash
      - git-linux
      - librewolf-linux
      - vscode-linux
    macos:
      - git-macos
      - librewolf-macos
      - vscode-macos
      - zsh
integrations:
  skills:
    - addyosmani/web-quality-skills@accessibility
    - addyosmani/web-quality-skills@web-quality-audit
    - adoreblvnk/cozydot@md-to-pdf
    - astral-sh/claude-code-plugins@uv
    - firecrawl/cli@firecrawl
    - mattpocock/skills@writing-for-agents
    - microsoft/playwright-cli@playwright-cli
    - multica-ai/andrej-karpathy-skills@karpathy-guidelines
    - pbakaus/impeccable@impeccable
    - slidevjs/slidev@slidev
    - upstash/context7@find-docs
    - vercel-labs/skills@find-skills
    - xberg-io/xberg@xberg
    - yamadashy/repomix@repomix-explorer
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
      - charliermarsh.ruff
      - golang.go
      - jolars.panache
      - llvm-vs-code-extensions.vscode-clangd
      - mathematic.vscode-pdf
      - ms-python.python
      - ms-python.vscode-pylance
      - oxc.oxc-vscode
      - redhat.vscode-yaml
      - rust-lang.rust-analyzer
      - streetsidesoftware.code-spell-checker
      - timonwong.shellcheck
      - yzhang.markdown-all-in-one
  linux:
    docker:
      group: true
      logging:
        driver: local
        max_size: 10m
    libvirt:
      group: true
desktop:
  theme: dark
  linux:
    gnome:
      button_layout: ":minimize,maximize,close" # default: ":close"
      center_new_windows: true                  # default: false
      dash_to_dock: true
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      files:
        show_hidden_files: true
        sort_folders_first: true
      idle:
        timeout: 15m
      keyboard:
        delay: 150                     # default: 500
        repeat_interval: 20            # default: 30
      rounded_window_corners: true
      terminal: wezterm                # default: gnome-terminal
  macos:
    dialogs:
      expand_save_panel: true
      save_to_cloud: false
    dock:
      autohide: true
      mru_spaces: false
      show_recent_applications: false
    finder:
      ds_store_on_external: false
      search_scope: SCcf               # default: SCev
      show_filename_extensions: true
      show_hidden_files: true
      show_path_bar: true
      show_status_bar: true
      sort_folders_first: true
      warn_on_extension_change: false
    keyboard:
      auto_substitutions: false
      initial_key_repeat: 15           # default: 25
      key_repeat: 2                    # default: 6
      keyboard_navigation: true
      press_and_hold: false
    screenshots:
      location: ~/Pictures/Screenshots # default: ~/Desktop
    trackpad:
      tap_to_click: true
updates:
  cozydot: true
  packages:
    homebrew: true
    linux:
      apt: upgrade
      flatpak: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    npm: true
  fonts: false
