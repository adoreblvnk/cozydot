version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
packages:
  linux:
    apt:
      install:
        - 7zip
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - ffmpeg
        - fzf
        - git
        - imagemagick
        - jq
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - shfmt
        - vim
        - vlc
      repos:
        - name: docker
          key_url: https://download.docker.com/linux/ubuntu/gpg
          key_path: /etc/apt/keyrings/docker.asc
          uris:
            ubuntu: https://download.docker.com/linux/ubuntu
            debian: https://download.docker.com/linux/debian
          suite: codename
          components:
            - stable
          conflicts:
            - docker.io
            - docker-compose
            - docker-compose-v2
            - docker-doc
            - docker-buildx
            - podman-docker
            - containerd
            - runc
          packages:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          uris:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
        - name: helium
          key_url: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
          key_path: /usr/share/keyrings/helium.gpg
          uris:
            default: https://pkg.helium.computer/deb
          suite: stable
          components:
            - main
          arch:
            - amd64
            - arm64
          packages:
            - helium-bin
        - name: onlyoffice
          key_url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
          key_path: /usr/share/keyrings/onlyoffice.gpg
          uris:
            default: https://download.onlyoffice.com/repo/debian
          suite: squeeze
          components:
            - main
          arch:
            - amd64
            - arm64
          packages:
            - onlyoffice-desktopeditors
        - name: virtualbox
          key_url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
          key_path: /usr/share/keyrings/oracle-virtualbox-2016.asc
          uris:
            ubuntu: https://download.virtualbox.org/virtualbox/debian
            debian: https://download.virtualbox.org/virtualbox/debian
          suite: codename
          components:
            - contrib
          arch:
            - amd64
          packages:
            - virtualbox-7.1
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          uris:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          uris:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly
    flatpak:
      - com.bitwarden.desktop
      - com.discordapp.Discord
      - com.obsproject.Studio
      - io.bassi.Amberol
      - net.sapples.LiveCaptions
      - org.gimp.GIMP
      - org.qbittorrent.qBittorrent
      - org.shotcut.Shotcut
      - org.telegram.desktop
    binaries:
      - name: drawio
        format: deb
        source:
          provider: github
          repo: jgraph/drawio-desktop
          assets:
            x86_64: ^drawio-amd64-.*\.deb$
            aarch64: ^drawio-arm64-.*\.deb$
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
      - name: obsidian
        format: appimage
        source:
          provider: github
          repo: obsidianmd/obsidian-releases
          assets:
            x86_64: ^Obsidian-[0-9]+(?:\.[0-9]+)+\.AppImage$
            aarch64: ^Obsidian-[0-9]+(?:\.[0-9]+)+-arm64\.AppImage$
      - name: zen-browser
        format: appimage
        source:
          provider: github
          repo: zen-browser/desktop
          assets:
            x86_64: ^zen-x86_6[0-9]\.AppImage$
            aarch64: ^zen-aarch6[0-9]\.AppImage$
  macos:
    homebrew:
      formulae:
        - cmake
        - fastfetch
        - ffmpeg
        - fzf
        - gh
        - git
        - imagemagick
        - jq
        - openjdk
        - pandoc
        - pass
        - pinentry-mac
        - sevenzip
        - shfmt
        - vim
        - yq
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - bitwarden
        - discord
        - docker
        - drawio
        - git-credential-manager
        - helium-browser
        - obs
        - obsidian
        - qbittorrent
        - shotcut
        - telegram
        - visual-studio-code
        - wezterm
        - zen
tools:
  rust: stable
  node: lts
  python: "3.13"
  go: latest
  cargo:
    - bat
    - bottom
    - du-dust
    - eza
    - fd-find
    - presenterm
    - resvg
    - ripgrep
    - starship
    - tealdeer
    - tokei
    - yazi-fm
    - zoxide
  npm:
    - "@playwright/cli"
    - "@slidev/cli"
    - lighthouse
    - opencode-ai
    - repomix
    - skills
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - bottom
      - fastfetch
      - git
      - gnupg
      - opencode
      - starship
      - wezterm
      - yazi
    linux:
      - bash
      - vscode-linux
    macos:
      - vscode-macos
      - zsh
integrations:
  skills:
    - addyosmani/web-quality-skills@accessibility
    - addyosmani/web-quality-skills@web-quality-audit
    - anthropics/skills@pdf
    - astral-sh/claude-code-plugins@uv
    - exa-labs/agent-skills@exa-search
    - jeffallan/claude-skills@prompt-engineer
    - mattpocock/skills@writing-for-agents
    - microsoft/playwright-cli@playwright-cli
    - multica-ai/andrej-karpathy-skills@karpathy-guidelines
    - pbakaus/impeccable@impeccable
    - slidevjs/slidev@slidev
    - upstash/context7@find-docs
    - vercel-labs/agent-skills@web-design-guidelines
    - vercel-labs/skills@find-skills
    - yamadashy/repomix@repomix-explorer
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
      - charliermarsh.ruff
      - christian-kohler.path-intellisense
      - eamodio.gitlens
      - esbenp.prettier-vscode
      - golang.go
      - llvm-vs-code-extensions.vscode-clangd
      - mathematic.vscode-pdf
      - ms-python.debugpy
      - ms-python.python
      - ms-python.vscode-pylance
      - redhat.vscode-yaml
      - rust-lang.rust-analyzer
      - streetsidesoftware.code-spell-checker
      - timonwong.shellcheck
      - yzhang.markdown-all-in-one
  linux:
    docker:
      group: true
      logging:
        driver: local
        max_size: 10m
    virtualbox:
      group: true
desktop:
  theme: dark
  linux:
    gnome:
      terminal: wezterm
      idle:
        timeout: 15m
        dim: false
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      dash_to_dock: true
      rounded_window_corners: true
  macos:
    dock:
      autohide: true
      show_recent_applications: false
    finder:
      show_filename_extensions: true
      show_hidden_files: true
    keyboard:
      key_repeat: 2 # macOS default: 6
      initial_key_repeat: 15 # macOS default: 25
    trackpad:
      tap_to_click: true
updates:
  packages:
    linux:
      apt: full-upgrade
      flatpak: true
    macos:
      homebrew:
        formulae: true
        casks: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    cargo: true
    npm: true
  fonts: true
