# Cross-platform Cozydot configuration.
version: 1.0.0

shared:
  tools:
    rust: stable
    node: lts
    python: "3.13"
    go: latest

  packages:
    cargo:
      - bat
      - bottom
      - du-dust
      - eza
      - fd-find
      - presenterm
      - starship
      - tealdeer
      - yazi-fm
      - zoxide
    npm:
      - "@playwright/cli"
      - opencode-ai
      - skills

  fonts:
    nerd:
      - GeistMono

  dotfiles:
    packages:
      - bat
      - bin
      - bottom
      - fastfetch
      - git
      - gnupg
      - opencode
      - starship
      - vscode
      - wezterm
      - yazi

  integrations:
    vscode:
      extensions:
        - catppuccin.catppuccin-vsc
        - charliermarsh.ruff
        - christian-kohler.path-intellisense
        - eamodio.gitlens
        - ecmel.vscode-html-css
        - foxundermoon.shell-format
        - golang.go
        - llvm-vs-code-extensions.vscode-clangd
        - ms-python.debugpy
        - ms-python.python
        - ms-python.vscode-pylance
        - prettier.prettier-vscode
        - redhat.vscode-yaml
        - rust-lang.rust-analyzer
        - streetsidesoftware.code-spell-checker
        - timonwong.shellcheck
        - wayou.vscode-todo-highlight
        - yzhang.markdown-all-in-one

  updates:
    tools:
      rust: true
      go: true
      node: true
      python: true
    packages:
      cargo: true
      npm: true
    fonts: true

linux:
  system:
    sudo_group: true
    allowed_platforms:
      distros:
        - ubuntu
        - debian
        - pop
        - linuxmint
      desktops:
        - gnome
        - cinnamon
    ubuntu:
      unattended_upgrades: disabled
      snapd: disabled
      restricted_extras: true

  packages:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - curl
        - default-jdk
        - ffmpeg
        - figlet
        - fzf
        - git
        - imagemagick
        - lolcat
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - trash-cli
        - ttf-mscorefonts-installer
        - unzip
        - vim
        - vlc
        - xz-utils
      repos:
        - name: docker
          key_url: https://download.docker.com/linux/ubuntu/gpg
          key_path: /etc/apt/keyrings/docker.asc
          urls:
            ubuntu: https://download.docker.com/linux/ubuntu
            debian: https://download.docker.com/linux/debian
          suite: system
          components:
            - stable
          conflicts:
            - docker.io
            - docker-compose
            - docker-compose-v2
            - docker-doc
            - podman-docker
            - containerd
            - runc
          packages:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          urls:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
        - name: helium
          key_url: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
          key_path: /usr/share/keyrings/helium.gpg
          urls:
            default: https://pkg.helium.computer/deb
          suite: stable
          components:
            - main
          arch:
            - amd64
            - arm64
          packages:
            - helium-bin
        - name: onlyoffice
          key_url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
          key_path: /usr/share/keyrings/onlyoffice.gpg
          urls:
            default: https://download.onlyoffice.com/repo/debian
          suite: squeeze
          components:
            - main
          arch:
            - amd64
            - arm64
          packages:
            - onlyoffice-desktopeditors
        - name: virtualbox
          key_url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
          key_path: /usr/share/keyrings/oracle-virtualbox-2016.asc
          urls:
            default: https://download.virtualbox.org/virtualbox/debian
          suite: system
          components:
            - contrib
          arch:
            - amd64
          packages:
            - virtualbox-7.1
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          urls:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          urls:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly

    flatpak:
      - com.bitwarden.desktop
      - com.discordapp.Discord
      - com.obsproject.Studio
      - io.bassi.Amberol
      - net.sapples.LiveCaptions
      - org.gimp.GIMP
      - org.qbittorrent.qBittorrent
      - org.shotcut.Shotcut
      - org.telegram.desktop

    binaries:
      - name: drawio
        format: deb
        source:
          provider: github
          repo: jgraph/drawio-desktop
          assets:
            x86_64: ^drawio-amd64-.*\.deb$
            aarch64: ^drawio-arm64-.*\.deb$
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
            arm: ^fastfetch-linux-armv7l.*\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
      - name: obsidian
        format: appimage
        source:
          provider: github
          repo: obsidianmd/obsidian-releases
          assets:
            x86_64: ^Obsidian-[0-9]+(?:\.[0-9]+)+\.AppImage$
            aarch64: ^Obsidian-[0-9]+(?:\.[0-9]+)+-arm64\.AppImage$
      - name: zen-browser
        format: appimage
        source:
          provider: github
          repo: zen-browser/desktop
          assets:
            x86_64: ^zen-x86_6[0-9]\.AppImage$
            aarch64: ^zen-aarch6[0-9]\.AppImage$

  dotfiles:
    packages:
      - bash

  integrations:
    docker:
      group: true
      logging:
        driver: local
        max_size: 10m
    virtualbox:
      group: true

  desktop:
    theme: dark
    terminal: wezterm
    idle:
      timeout: 15m
      dim: false
    gnome:
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      dash_to_dock: true
      rounded_window_corners: true

  updates:
    apt: full-upgrade
    flatpak: true

macos:
  system:
    validate_sudo_access: true
    xcode:
      command_line_tools: true

  homebrew:
    formulae:
      - cmake
      - ffmpeg
      - fastfetch
      - figlet
      - fzf
      - gh
      - git
      - imagemagick
      - lolcat
      - openjdk
      - pandoc
      - pass
      - pinentry-mac
      - stow
      - trash
      - vim
    casks:
      - bitwarden
      - discord
      - docker
      - drawio
      - gimp
      - git-credential-manager
      - helium-browser
      - obs
      - obsidian
      - onlyoffice
      - qbittorrent
      - shotcut
      - telegram
      - virtualbox
      - visual-studio-code
      - vlc
      - wezterm
      - zen

  dotfiles:
    packages:
      - zsh

  desktop:
    appearance: dark
    dock:
      autohide: true
      show_recent_applications: false
    finder:
      show_filename_extensions: true
      show_hidden_files: true
    keyboard:
      key_repeat: 2 # macOS default: 6
      initial_key_repeat: 15 # macOS default: 25
    trackpad:
      tap_to_click: true

  updates:
    homebrew:
      formulae: true
      casks: true
