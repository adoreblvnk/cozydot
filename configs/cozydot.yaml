version: 1.0.0
system:
  ensure_admin: true
  apt:
    sources:
      mode: preserve
    unattended_upgrades: disabled
  ubuntu:
    snap: disabled
    codecs: installed
  require:
    distros:
      - ubuntu
      - debian
      - pop
      - linuxmint
    desktops:
      - gnome
      - cinnamon
packages:
  apt:
    remove:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    install:
      - bash-completion
      - build-essential
      - cmake
      - curl
      - default-jdk
      - ffmpeg
      - figlet
      - fzf
      - git
      - imagemagick
      - lolcat
      - openssh-server
      - pandoc
      - pass
      - pinentry-tty
      - trash-cli
      - unzip
      - vim
      - vlc
      - xz-utils
    repositories:
      - name: docker
        key: https://download.docker.com/linux/ubuntu/gpg
        key_path: /etc/apt/keyrings/docker.asc
        urls:
          ubuntu: https://download.docker.com/linux/ubuntu
          debian: https://download.docker.com/linux/debian
        suite: system
        components:
          - stable
        packages:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
      - name: github-cli
        key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        urls:
          default: https://cli.github.com/packages
        suite: stable
        components: [main]
        packages: [gh]
      - name: vscode
        key: https://packages.microsoft.com/keys/microsoft.asc
        key_path: /etc/apt/keyrings/packages.microsoft.gpg
        urls:
          default: https://packages.microsoft.com/repos/code
        suite: stable
        components: [main]
        packages: [code]
      - name: wezterm
        key: https://apt.fury.io/wez/gpg.key
        key_path: /usr/share/keyrings/wezterm-fury.asc
        urls:
          default: https://apt.fury.io/wez/
        suite: '*'
        components:
          - '*'
        packages:
          - wezterm-nightly
  flatpak:
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.obsproject.Studio
    - io.bassi.Amberol
    - net.sapples.LiveCaptions
    - org.gimp.GIMP
    - org.qbittorrent.qBittorrent
    - org.telegram.desktop
  cargo:
    - bat
    - bottom
    - du-dust
    - eza
    - fd-find
    - presenterm
    - starship
    - tealdeer
    - yazi-fm
    - zoxide
  npm:
    - "@playwright/cli"
    - opencode-ai
    - skills
  binaries:
    - name: fastfetch
      format: deb
      commands:
        - fastfetch
      source:
        provider: github
        repository: fastfetch-cli/fastfetch
        assets:
          amd64: ^fastfetch-linux-amd64\.deb$
          arm64: ^fastfetch-linux-aarch64\.deb$
          arm32: ^fastfetch-linux-armv7l.*\.deb$
    - name: git-credential-manager
      format: deb
      commands:
        - git-credential-manager
      source:
        provider: github
        repository: git-ecosystem/git-credential-manager
        assets:
          amd64: ^gcm-linux-x64-.*\.deb$
          arm64: ^gcm-linux-arm64-.*\.deb$
    - name: obsidian
      format: appimage
      source:
        provider: github
        repository: obsidianmd/obsidian-releases
        assets:
          amd64: ^Obsidian-[0-9]+(?:\.[0-9]+)+\.AppImage$
          arm64: ^Obsidian-[0-9]+(?:\.[0-9]+)+-arm64\.AppImage$
    - name: zen-browser
      format: appimage
      source:
        provider: github
        repository: zen-browser/desktop
        assets:
          amd64: ^zen-x86_6[0-9]\.AppImage$
          arm64: ^zen-aarch6[0-9]\.AppImage$
tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"
fonts:
  nerd: [GeistMono]
dotfiles:
  packages:
    - bash
    - bin
    - bat
    - bottom
    - fastfetch
    - opencode
    - starship
    - vscode
    - wezterm
    - yazi
integrations:
  appimaged: true
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
      - charliermarsh.ruff
      - eamodio.gitlens
      - ms-python.python
      - redhat.vscode-yaml
      - yzhang.markdown-all-in-one
  docker:
    add_user_to_group: true
    logging:
      driver: local
      max_size: 10m
desktop:
  theme: dark
  terminal: wezterm
  idle:
    timeout: 15m
    dim: false
  gnome:
    extensions:
      - blur-my-shell@aunetx
      - netspeedsimplified@prateekmedia.extension
    dock: true
    rounded_corners: true
updates:
  apt: standard
  flatpak: true
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
    binaries: true
  fonts: true
