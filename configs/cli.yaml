version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    xcode:
      command_line_tools: true
packages:
  homebrew:
    formulae:
      - bat
      - bottom
      - can1357/tap/omp
      - cmake
      - dust
      - eza
      - fastfetch
      - fd
      - ffmpeg
      - fzf
      - gh
      - imagemagick
      - jq
      - openjdk
      - opencode
      - oxfmt
      - oxlint
      - panache
      - pass
      - presenterm
      - resvg
      - ripgrep
      - sevenzip
      - shfmt
      - starship
      - tlrc
      - tokei
      - vim
      - yazi
      - yq
      - zoxide
    casks: []
  linux:
    apt:
      install:
        - bash-completion
        - libvirt-daemon-system
        - openssh-server
        - pinentry-tty
        - qemu-system
        - wl-clipboard
      repos: []
    flatpak: []
    binaries:
      - name: git-credential-manager
        format: deb
        urls:
          x86_64: https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.9.1/gcm-linux-x64-2.9.1.deb
          aarch64: https://github.com/git-ecosystem/git-credential-manager/releases/download/v2.9.1/gcm-linux-arm64-2.9.1.deb
  macos:
    homebrew:
      formulae:
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - git-credential-manager
tools:
  rust: stable
  node: lts
  python: "3"
  go: latest
  npm:
    - "@slidev/cli"
    - firecrawl-cli
    - skills
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - bottom
      - fastfetch
      - git
      - gnupg
      - opencode
      - starship
      - yazi
    linux:
      - bash
    macos:
      - zsh
integrations:
  skills:
    - addyosmani/web-quality-skills@accessibility
    - addyosmani/web-quality-skills@web-quality-audit
    - adoreblvnk/cozydot@md-to-pdf
    - astral-sh/claude-code-plugins@uv
    - firecrawl/cli@firecrawl
    - mattpocock/skills@writing-for-agents
    - microsoft/playwright-cli@playwright-cli
    - multica-ai/andrej-karpathy-skills@karpathy-guidelines
    - pbakaus/impeccable@impeccable
    - slidevjs/slidev@slidev
    - upstash/context7@find-docs
    - vercel-labs/skills@find-skills
    - xberg-io/xberg@xberg
    - yamadashy/repomix@repomix-explorer
  vscode:
    extensions: []
  linux: {}
updates:
  cozydot: true
  packages:
    homebrew: true
    linux:
      apt: upgrade
      flatpak: false
  tools:
    rust: true
    node: true
    python: true
    go: true
    npm: true
  fonts: false
