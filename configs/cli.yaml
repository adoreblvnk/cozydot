version: 1.0.0
system:
  ensure_admin: true
  apt:
    sources:
      mode: preserve
    unattended_upgrades: disabled
  ubuntu:
    snap: disabled
  require:
    distros:
      - ubuntu
      - debian
      - pop
      - linuxmint
    desktops:
      - gnome
      - cinnamon
packages:
  apt:
    install:
      - bash-completion
      - build-essential
      - cmake
      - curl
      - default-jdk
      - figlet
      - fzf
      - git
      - lolcat
      - openssh-server
      - pandoc
      - pass
      - pinentry-tty
      - trash-cli
      - unzip
      - vim
      - xz-utils
    repositories:
      - name: github-cli
        key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        urls:
          default: https://cli.github.com/packages
        suite: stable
        components: [main]
        packages: [gh]
  cargo:
    - bat
    - bottom
    - du-dust
    - eza
    - fd-find
    - presenterm
    - starship
    - tealdeer
    - yazi-fm
    - zoxide
  npm:
    - opencode-ai
  binaries:
    - name: fastfetch
      format: deb
      commands:
        - fastfetch
      source:
        provider: github
        repository: fastfetch-cli/fastfetch
        assets:
          amd64: ^fastfetch-linux-amd64\.deb$
          arm64: ^fastfetch-linux-aarch64\.deb$
          arm32: ^fastfetch-linux-armv7l.*\.deb$
    - name: git-credential-manager
      format: deb
      commands:
        - git-credential-manager
      source:
        provider: github
        repository: git-ecosystem/git-credential-manager
        assets:
          amd64: ^gcm-linux-x64-.*\.deb$
          arm64: ^gcm-linux-arm64-.*\.deb$
tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"
fonts:
  nerd: [GeistMono]
dotfiles:
  packages:
    - bash
    - bin
    - bat
    - bottom
    - fastfetch
    - starship
    - yazi
integrations:
  appimaged: false
updates:
  apt: standard
  tools:
    rust: true
    node: true
  packages:
    cargo: true
    npm: true
    binaries: true
  fonts: true
