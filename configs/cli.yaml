version: 1.0.0
system:
  ensure_admin: true
  apt:
    sources:
      mode: preserve
    unattended_upgrades: disabled
  ubuntu:
    snap: disabled
packages:
  apt:
    install:
      - bash-completion
      - build-essential
      - cmake
      - curl
      - git
      - openssh-server
      - pandoc
      - pass
      - trash-cli
      - unzip
      - vim
      - xz-utils
    repositories:
      - name: github-cli
        key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        urls:
          default: https://cli.github.com/packages
        suite: stable
        components: [main]
        packages: [gh]
  cargo:
    - bat
    - bottom
    - du-dust
    - fd-find
    - presenterm
    - starship
    - tealdeer
  npm: [opencode-ai]
tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"
fonts:
  nerd: [GeistMono]
dotfiles:
  packages: [bash, bin, bat, bottom, fastfetch, starship, yazi]
updates:
  apt: standard
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
