version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
packages:
  linux:
    apt:
      install:
        - 7zip
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - ffmpeg
        - fzf
        - git
        - imagemagick
        - jq
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - shfmt
        - vim
      repos:
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          uris:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
    flatpak: []
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  macos:
    homebrew:
      formulae:
        - cmake
        - fastfetch
        - ffmpeg
        - fzf
        - gh
        - git
        - imagemagick
        - jq
        - openjdk
        - pandoc
        - pass
        - pinentry-mac
        - sevenzip
        - shfmt
        - vim
        - yq
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - git-credential-manager
tools:
  rust: stable
  node: lts
  python: "3"
  go: latest
  cargo:
    - bat
    - bottom
    - du-dust
    - eza
    - fd-find
    - presenterm
    - resvg
    - ripgrep
    - starship
    - tealdeer
    - tokei
    - yazi-fm
    - zoxide
  npm:
    - "@slidev/cli"
    - firecrawl-cli
    - lighthouse
    - opencode-ai
    - skills
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - bottom
      - fastfetch
      - git
      - gnupg
      - opencode
      - starship
      - yazi
    linux:
      - bash
    macos:
      - zsh
integrations:
  skills:
    - addyosmani/web-quality-skills@accessibility
    - addyosmani/web-quality-skills@web-quality-audit
    - anthropics/skills@pdf
    - astral-sh/claude-code-plugins@uv
    - firecrawl/cli@firecrawl
    - jeffallan/claude-skills@prompt-engineer
    - mattpocock/skills@writing-for-agents
    - microsoft/playwright-cli@playwright-cli
    - multica-ai/andrej-karpathy-skills@karpathy-guidelines
    - pbakaus/impeccable@impeccable
    - slidevjs/slidev@slidev
    - upstash/context7@find-docs
    - vercel-labs/agent-skills@web-design-guidelines
    - vercel-labs/skills@find-skills
    - yamadashy/repomix@repomix-explorer
  vscode:
    extensions: []
  linux: {}
updates:
  packages:
    linux:
      apt: upgrade
      flatpak: false
    macos:
      homebrew:
        formulae: true
        casks: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    cargo: true
    npm: true
  fonts: false
