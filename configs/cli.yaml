version: 1.0.0
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
  macos:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
packages:
  linux:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - figlet
        - fzf
        - git
        - lolcat
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - trash-cli
        - ttf-mscorefonts-installer
        - vim
      repos:
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          uris:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  macos:
    homebrew:
      formulae:
        - cmake
        - ffmpeg
        - fastfetch
        - figlet
        - fzf
        - gh
        - git
        - imagemagick
        - lolcat
        - openjdk
        - pandoc
        - pass
        - pinentry-mac
        - trash
        - vim
      casks:
        - git-credential-manager
tools:
  rust: stable
  node: lts
  python: "3.13"
  go: latest
  cargo:
    - bat
    - bottom
    - du-dust
    - eza
    - fd-find
    - presenterm
    - starship
    - tealdeer
    - yazi-fm
    - zoxide
  npm:
    - opencode-ai
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - bottom
      - fastfetch
      - git
      - gnupg
      - starship
      - yazi
    linux:
      - bash
    macos:
      - zsh
integrations:
  vscode:
    extensions: []
  linux: {}
updates:
  packages:
    linux:
      apt: full-upgrade
    macos:
      homebrew:
        formulae: true
        casks: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    cargo: true
    npm: true
  fonts: true
