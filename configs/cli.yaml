# Cross-platform Cozydot configuration.
version: 1.0.0
shared:
  tools:
    rust: stable
    node: lts
    python: "3.13"
    go: latest
  packages:
    cargo:
      - bat
      - bottom
      - du-dust
      - eza
      - fd-find
      - presenterm
      - starship
      - tealdeer
      - yazi-fm
      - zoxide
    npm:
      - opencode-ai
  fonts:
    nerd:
      - GeistMono
  dotfiles:
    packages:
      - bat
      - bin
      - bottom
      - fastfetch
      - git
      - gnupg
      - starship
      - yazi
  integrations:
    vscode:
      extensions: []
  updates:
    tools:
      rust: true
      go: true
      node: true
      python: true
    packages:
      cargo: true
      npm: true
    fonts: true
linux:
  system:
    add_user_to_sudo_group: true
    require:
      distros:
        - ubuntu
        - debian
        - pop
        - linuxmint
    ubuntu:
      unattended_upgrades: disabled
      snapd: disabled
  packages:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - curl
        - default-jdk
        - figlet
        - fzf
        - git
        - lolcat
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - trash-cli
        - ttf-mscorefonts-installer
        - unzip
        - vim
        - xz-utils
      repositories:
        - name: github-cli
          key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          urls:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repository: fastfetch-cli/fastfetch
          assets:
            amd64: ^fastfetch-linux-amd64\.deb$
            arm64: ^fastfetch-linux-aarch64\.deb$
            arm32: ^fastfetch-linux-armv7l.*\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repository: git-ecosystem/git-credential-manager
          assets:
            amd64: ^gcm-linux-x64-.*\.deb$
            arm64: ^gcm-linux-arm64-.*\.deb$
  dotfiles:
    packages:
      - bash
  integrations: {}
  updates:
    apt: full-upgrade
macos:
  system:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
    rosetta: false
  homebrew:
    formulae:
      - cmake
      - ffmpeg
      - fastfetch
      - figlet
      - fzf
      - gh
      - git
      - imagemagick
      - lolcat
      - openjdk
      - pandoc
      - pass
      - pinentry-mac
      - stow
      - trash
      - vim
    casks:
      - bitwarden
      - discord
      - docker
      - drawio
      - gimp
      - git-credential-manager
      - helium-browser
      - obs
      - obsidian
      - onlyoffice
      - qbittorrent
      - shotcut
      - telegram
      - virtualbox
      - visual-studio-code
      - vlc
      - wezterm
      - zen
  dotfiles:
    packages:
      - zsh
  desktop:
    appearance: dark
    dock:
      autohide: true
      show_recent_applications: false
    finder:
      show_filename_extensions: true
      show_hidden_files: true
    keyboard:
      key_repeat: 2
      initial_key_repeat: 15
    trackpad:
      tap_to_click: true
  updates:
    homebrew:
      formulae: true
      casks: true
