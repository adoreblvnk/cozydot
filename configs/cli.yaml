# Cross-platform Cozydot configuration.
version: 1.0.0
shared:
  tools:
    rust: stable
    node: lts
    python: "3.13"
    go: latest
  packages:
    cargo:
      - bat
      - bottom
      - du-dust
      - eza
      - fd-find
      - presenterm
      - starship
      - tealdeer
      - yazi-fm
      - zoxide
    npm:
      - opencode-ai
  fonts:
    nerd:
      - GeistMono
  dotfiles:
    packages:
      - bat
      - bin
      - bottom
      - fastfetch
      - git
      - gnupg
      - starship
      - yazi
  integrations:
    vscode:
      extensions: []
  updates:
    tools:
      rust: true
      go: true
      node: true
      python: true
    packages:
      cargo: true
      npm: true
    fonts: true
linux:
  system:
    debian:
      sudo_group: true
    ubuntu:
      unattended_upgrades: disabled
      snapd: disabled
  packages:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - figlet
        - fzf
        - git
        - lolcat
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - trash-cli
        - ttf-mscorefonts-installer
        - vim
      repos:
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
          uris:
            default: https://cli.github.com/packages
          suite: stable
          components:
            - main
          packages:
            - gh
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  dotfiles:
    packages:
      - bash
  integrations: {}
  updates:
    apt: full-upgrade
macos:
  system:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
  homebrew:
    formulae:
      - cmake
      - ffmpeg
      - fastfetch
      - figlet
      - fzf
      - gh
      - git
      - imagemagick
      - lolcat
      - openjdk
      - pandoc
      - pass
      - pinentry-mac
      - trash
      - vim
    casks:
      - git-credential-manager
  dotfiles:
    packages:
      - zsh
  updates:
    homebrew:
      formulae: true
      casks: true
