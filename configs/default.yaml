version: 1.0.0
system:
  ensure_admin: true
  apt:
    sources:
      mode: preserve
    unattended_upgrades: disabled
  ubuntu:
    snap: disabled
    codecs: installed
packages:
  apt:
    install:
      - bash-completion
      - build-essential
      - cmake
      - curl
      - ffmpeg
      - git
      - imagemagick
      - openssh-server
      - pandoc
      - pass
      - trash-cli
      - unzip
      - vim
      - vlc
      - xz-utils
    repositories:
      - name: github-cli
        key: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        urls:
          default: https://cli.github.com/packages
        suite: stable
        components: [main]
        packages: [gh]
      - name: vscode
        key: https://packages.microsoft.com/keys/microsoft.asc
        urls:
          default: https://packages.microsoft.com/repos/code
        suite: stable
        components: [main]
        packages: [code]
  flatpak:
    - com.bitwarden.desktop
    - com.discordapp.Discord
    - com.obsproject.Studio
    - io.bassi.Amberol
    - org.gimp.GIMP
    - org.qbittorrent.qBittorrent
    - org.telegram.desktop
  cargo:
    - bat
    - bottom
    - du-dust
    - fd-find
    - starship
    - tealdeer
  npm:
    - opencode-ai
    - skills
    - "@playwright/cli"
tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"
fonts:
  nerd: [GeistMono]
dotfiles:
  packages:
    - bash
    - bin
    - bat
    - bottom
    - fastfetch
    - opencode
    - starship
    - vscode
    - wezterm
    - yazi
integrations:
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
      - charliermarsh.ruff
      - eamodio.gitlens
      - ms-python.python
      - redhat.vscode-yaml
      - yzhang.markdown-all-in-one
desktop:
  theme: dark
  terminal: x-terminal-emulator
  idle:
    timeout: 15m
    dim: false
  gnome:
    extensions:
      - blur-my-shell@aunetx
      - netspeedsimplified@prateekmedia.extension
    dock: true
    rounded_corners: true
updates:
  apt: standard
  flatpak: true
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
