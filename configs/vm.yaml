# Cross-platform Cozydot configuration.
version: 1.0.0
shared:
  tools:
    rust: stable
    node: latest
    python: "3.13"
    go: latest
  packages:
    cargo:
      - bat
      - fd-find
      - starship
      - tealdeer
    npm:
      - opencode-ai
  fonts:
    nerd:
      - GeistMono
  dotfiles:
    packages:
      - bat
      - bin
      - bottom
      - fastfetch
      - git
      - gnupg
      - starship
      - vscode
      - wezterm
      - yazi
  integrations:
    vscode:
      extensions:
        - catppuccin.catppuccin-vsc
  updates:
    tools:
      rust: true
      go: true
      node: true
      python: true
    packages:
      cargo: true
      npm: true
    fonts: true
linux:
  system:
    sudo_group: true
    allowed_platforms:
      distros:
        - ubuntu
        - debian
      desktops:
        - gnome
    ubuntu:
      unattended_upgrades: disabled
      snapd: disabled
      restricted_extras: true
  packages:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - ffmpeg
        - figlet
        - fzf
        - git
        - imagemagick
        - lolcat
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - trash-cli
        - ttf-mscorefonts-installer
        - vim
        - vlc
      repos:
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          uris:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          uris:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly
    flatpak:
      - com.bitwarden.desktop
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  dotfiles:
    packages:
      - bash
  integrations: {}
  desktop:
    theme: dark
    terminal: wezterm
    idle:
      timeout: 15m
      dim: false
    gnome:
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      dash_to_dock: true
      rounded_window_corners: true
  updates:
    apt: full-upgrade
    flatpak: true
macos:
  system:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
  homebrew:
    formulae:
      - cmake
      - ffmpeg
      - fastfetch
      - figlet
      - fzf
      - gh
      - git
      - imagemagick
      - lolcat
      - openjdk
      - pandoc
      - pass
      - pinentry-mac
      - trash
      - vim
    casks:
      - bitwarden
      - discord
      - docker
      - drawio
      - gimp
      - git-credential-manager
      - helium-browser
      - obs
      - obsidian
      - onlyoffice
      - qbittorrent
      - shotcut
      - telegram
      - virtualbox
      - visual-studio-code
      - vlc
      - wezterm
      - zen
  dotfiles:
    packages:
      - zsh
  desktop:
    appearance: dark
    dock:
      autohide: true
      show_recent_applications: false
    finder:
      show_filename_extensions: true
      show_hidden_files: true
    keyboard:
      key_repeat: 2 # macOS default: 6
      initial_key_repeat: 15 # macOS default: 25
    trackpad:
      tap_to_click: true
  updates:
    homebrew:
      formulae: true
      casks: true
