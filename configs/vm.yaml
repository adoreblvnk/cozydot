metadata:
  description: Lightweight config with minimal utilities / apps installed for virtual machines.
  distro: auto
  DE: auto
check:
  distroCfg: true
  purge: !disabled
    # docker installed via aptAltSources
    - docker.io
    - docker-doc
    - docker-compose
    - docker-compose-v2
    - podman-docker
    - containerd
    - runc
    - "*firefox*" # firefox installed via aptAltSources
    - "*libreoffice*" # libreoffice replaced with onlyoffice
  deps: !enabled
    # essential packages
    - apt-transport-https
    - bash-completion
    - build-essential
    - ca-certificates
    - cmake
    - curl
    - ffmpeg
    - flatpak
    - git
    - pinentry-tty
    - software-properties-common
    - stow
    - ttf-mscorefonts-installer
    - unzip
    # pyenv dependencies
    - libbz2-dev
    - libffi-dev
    - liblzma-dev
    - libncurses-dev # libncursesw5-dev is a transitional pkg
    - libreadline-dev
    - libsqlite3-dev
    - libssl-dev
    - libxml2-dev
    - libxmlsec1-dev
    - tk-dev
    - xz-utils
    - zlib1g-dev
    # imagemagick dependencies
    - libjpeg-dev
    - libpng-dev
    - libtiff-dev
  rustupCheck: true
  appimaged: true
  nerdfont: !enabled GeistMono
install:
  check: true
  apt: !enabled
    - default-jdk
    - figlet
    - gnupg2
    - imagemagick # image converter
    - lolcat
    - openssh-server
    - pandoc # document converter
    - pass
    - trash-cli
    - vim
    - vlc
  addRepos: !enabled
    - sourceName: vscode
      remoteKey: https://packages.microsoft.com/keys/microsoft.asc
      keyPath: /etc/apt/keyrings/packages.microsoft.gpg
      repo: deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main
      pinning: false
      packages:
        - code
  flatpak: !disabled []
  cargo: !enabled
    - bat --locked # cat replacement
    - bottom --locked # process / system monitor
    - starship --locked
  npm: !enabled
    - opencode-ai
  binaries: !enabled
    - name: git-credential-manager.deb
      url: $(curl -sSL https://api.github.com/repos/git-ecosystem/git-credential-manager/releases/latest | yq ".assets[].browser_download_url | select(. == \"*linux-${X64_ARCH}-*.deb\")")
  languages:
    goVersion: !enabled latest
    nodeVersion: !enabled latest
    pyenv: !disabled
      update: false
      version: 3
      pip: true
    uv: !enabled
      version: !enabled 3.13
update:
  check: true
  apt: !enabled
    aptFull: false
  flatpak: true
  cargo: false
  other:
    yq: true
    go: false
    node: false
configure:
  check: true
  dotfiles: !enabled
    stowMode: override
    packages:
      - bash
      - bin
      - bat
      - bottom
      - fastfetch
      - starship
      - vscode
      - wezterm
  apps:
    docker: false
    virtualbox: false
    vscodeExtensions: !enabled
      - catppuccin.catppuccin-vsc
  desktopEnvironment: !enabled
    common: !enabled
      defaultTerm: !enabled wezterm
    gnome: !enabled
      settings: true
      extensions: !enabled
        # - dash-to-dock@micxgx.gmail.com # Ubuntu already has a conflicting pkg
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
        - rounded-window-corners@fxgn
      MacOSDock: true
      smoothRoundedCorners: true
    cinnamon: !enabled
