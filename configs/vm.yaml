version: 1.0.0
system:
  ensure_admin: true
  apt:
    sources:
      mode: managed
      components:
        ubuntu:
          - main
          - restricted
          - universe
          - multiverse
        debian:
          - main
          - contrib
          - non-free
          - non-free-firmware
    unattended_upgrades: disabled
  ubuntu:
    snap: disabled
    codecs: installed
  require:
    distros:
      - ubuntu
      - debian
    desktops:
      - gnome
packages:
  apt:
    install:
      - bash-completion
      - build-essential
      - cmake
      - curl
      - default-jdk
      - ffmpeg
      - figlet
      - fzf
      - git
      - imagemagick
      - lolcat
      - openssh-server
      - pandoc
      - pass
      - pinentry-tty
      - trash-cli
      - ttf-mscorefonts-installer
      - unzip
      - vim
      - vlc
      - xz-utils
    repositories:
      - name: vscode
        key: https://packages.microsoft.com/keys/microsoft.asc
        key_path: /etc/apt/keyrings/packages.microsoft.gpg
        urls:
          default: https://packages.microsoft.com/repos/code
        suite: stable
        components: [main]
        packages: [code]
      - name: wezterm
        key: https://apt.fury.io/wez/gpg.key
        key_path: /usr/share/keyrings/wezterm-fury.asc
        urls:
          default: https://apt.fury.io/wez/
        suite: '*'
        components:
          - '*'
        packages:
          - wezterm-nightly
  flatpak:
    - com.bitwarden.desktop
  cargo:
    - bat
    - fd-find
    - starship
    - tealdeer
  npm:
    - opencode-ai
  binaries:
    - name: fastfetch
      format: deb
      commands:
        - fastfetch
      source:
        provider: github
        repository: fastfetch-cli/fastfetch
        assets:
          amd64: ^fastfetch-linux-amd64\.deb$
          arm64: ^fastfetch-linux-aarch64\.deb$
          arm32: ^fastfetch-linux-armv7l.*\.deb$
    - name: git-credential-manager
      format: deb
      commands:
        - git-credential-manager
      source:
        provider: github
        repository: git-ecosystem/git-credential-manager
        assets:
          amd64: ^gcm-linux-x64-.*\.deb$
          arm64: ^gcm-linux-arm64-.*\.deb$
tools:
  rust: stable
  go: latest
  node: latest
  python: "3.13"
fonts:
  nerd: [GeistMono]
dotfiles:
  packages:
    - bash
    - bin
    - bat
    - bottom
    - fastfetch
    - starship
    - vscode
    - wezterm
    - yazi
integrations:
  appimaged: false
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
desktop:
  theme: dark
  terminal: wezterm
  idle:
    timeout: 15m
    dim: false
  gnome:
    extensions:
      - blur-my-shell@aunetx
      - netspeedsimplified@prateekmedia.extension
    dock: true
    rounded_corners: true
updates:
  apt: full
  flatpak: true
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
    binaries: true
  fonts: true
