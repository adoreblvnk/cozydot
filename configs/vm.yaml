schema: 1

system:
  distro: auto
  desktop: auto
  ensure_admin: true
  apt:
    sources: preserve
    unattended_upgrades: false
  ubuntu:
    snap: false

packages:
  apt:
    - bash-completion
    - build-essential
    - curl
    - git
    - openssh-server
    - unzip
    - vim
    - xz-utils
  repositories:
    - name: vscode
      key: https://packages.microsoft.com/keys/microsoft.asc
      source:
        urls:
          default: https://packages.microsoft.com/repos/code
        suite: stable
        components: [main]
      packages: [code]
  cargo: [bat, bottom, starship]
  npm: [opencode-ai]

tools:
  rust: stable
  go: latest
  node: lts
  python: "3.13"

fonts:
  nerd: [GeistMono]

dotfiles:
  packages: [bash, bin, bat, bottom, fastfetch, starship, vscode]

integrations:
  vscode:
    extensions: [catppuccin.catppuccin-vsc]

desktop:
  theme: dark
  idle:
    timeout: 15m
    dim: false
  gnome:
    extensions:
      - blur-my-shell@aunetx
      - netspeedsimplified@prateekmedia.extension
    rounded_corners: true

updates:
  apt: standard
