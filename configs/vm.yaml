version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    validate_sudo_access: true
    xcode:
      command_line_tools: true
packages:
  linux:
    apt:
      install:
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - ffmpeg
        - fzf
        - git
        - imagemagick
        - jq
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - shfmt
        - trash-cli
        - vim
      repos:
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          uris:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          uris:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly
    flatpak:
      - com.bitwarden.desktop
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  macos:
    homebrew:
      formulae:
        - cmake
        - fastfetch
        - ffmpeg
        - fzf
        - gh
        - git
        - imagemagick
        - jq
        - openjdk
        - pandoc
        - pass
        - pinentry-mac
        - shfmt
        - trash
        - vim
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - bitwarden
        - git-credential-manager
        - visual-studio-code
        - wezterm
tools:
  rust: stable
  node: latest
  python: "3.13"
  go: latest
  cargo:
    - bat
    - fd-find
    - starship
    - tealdeer
  npm:
    - opencode-ai
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - fastfetch
      - git
      - gnupg
      - starship
      - wezterm
    linux:
      - bash
      - vscode-linux
    macos:
      - zsh
integrations:
  skills:
    - anthropics/skills@pdf
    - astral-sh/claude-code-plugins@uv
    - jeffallan/claude-skills@prompt-engineer
    - mattpocock/skills@writing-for-agents
    - microsoft/playwright-cli@playwright-cli
    - multica-ai/andrej-karpathy-skills@karpathy-guidelines
    - pbakaus/impeccable@impeccable
    - slidevjs/slidev@slidev
    - vercel-labs/agent-skills@web-design-guidelines
    - vercel-labs/skills@find-skills
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
  linux: {}
desktop:
  theme: dark
  linux:
    gnome:
      terminal: wezterm
      idle:
        timeout: 15m
        dim: false
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      dash_to_dock: true
      rounded_window_corners: true
  macos:
    dock:
      autohide: true
      show_recent_applications: false
    finder:
      show_filename_extensions: true
      show_hidden_files: true
    keyboard:
      key_repeat: 2 # macOS default: 6
      initial_key_repeat: 15 # macOS default: 25
    trackpad:
      tap_to_click: true
updates:
  packages:
    linux:
      apt: full-upgrade
      flatpak: true
    macos:
      homebrew:
        formulae: true
        casks: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    cargo: true
    npm: true
  fonts: true
