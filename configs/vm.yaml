version: 1
system:
  debian:
    sudo_group: true
  ubuntu:
    unattended_upgrades: disabled
    snapd: disabled
    restricted_extras: true
  macos:
    xcode:
      command_line_tools: true
packages:
  linux:
    apt:
      install:
        - 7zip
        - bash-completion
        - build-essential
        - cmake
        - default-jdk
        - ffmpeg
        - fzf
        - git
        - imagemagick
        - jq
        - openssh-server
        - pandoc
        - pass
        - pinentry-tty
        - shfmt
        - vim
        - vlc
      repos:
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          key_path: /etc/apt/keyrings/packages.microsoft.gpg
          uris:
            default: https://packages.microsoft.com/repos/code
          suite: stable
          components:
            - main
          packages:
            - code
        - name: wezterm
          key_url: https://apt.fury.io/wez/gpg.key
          key_path: /usr/share/keyrings/wezterm-fury.asc
          uris:
            default: https://apt.fury.io/wez/
          suite: "*"
          components:
            - "*"
          packages:
            - wezterm-nightly
    flatpak:
      - com.bitwarden.desktop
    binaries:
      - name: fastfetch
        format: deb
        source:
          provider: github
          repo: fastfetch-cli/fastfetch
          assets:
            x86_64: ^fastfetch-linux-amd64\.deb$
            aarch64: ^fastfetch-linux-aarch64\.deb$
      - name: git-credential-manager
        format: deb
        source:
          provider: github
          repo: git-ecosystem/git-credential-manager
          assets:
            x86_64: ^gcm-linux-x64-.*\.deb$
            aarch64: ^gcm-linux-arm64-.*\.deb$
  macos:
    homebrew:
      formulae:
        - cmake
        - fastfetch
        - ffmpeg
        - fzf
        - gh
        - git
        - imagemagick
        - jq
        - openjdk
        - pandoc
        - pass
        - sevenzip
        - shfmt
        - vim
        - yq
        - zsh-autosuggestions
        - zsh-syntax-highlighting
      casks:
        - bitwarden
        - git-credential-manager
        - visual-studio-code
        - wezterm
tools:
  rust: stable
  node: lts
  python: "3"
  go: latest
  cargo:
    - bat
    - fd-find
    - starship
    - tealdeer
  npm:
    - opencode-ai
fonts:
  nerd:
    - GeistMono
dotfiles:
  replace: true
  packages:
    all:
      - bat
      - fastfetch
      - git
      - gnupg
      - starship
      - wezterm
    linux:
      - bash
      - vscode-linux
    macos:
      - zsh
integrations:
  skills: []
  vscode:
    extensions:
      - catppuccin.catppuccin-vsc
  linux: {}
desktop:
  theme: dark
  linux:
    gnome:
      button_layout: ":minimize,maximize,close" # default: ":close"
      dash_to_dock: true
      extensions:
        - blur-my-shell@aunetx
        - netspeedsimplified@prateekmedia.extension
      files:
        show_hidden_files: true
        sort_folders_first: true
      idle:
        timeout: 15m
        dim: false
      keyboard:
        delay: 200 # default: 500
        repeat_interval: 30 # default: 30
      rounded_window_corners: true
      terminal: wezterm # default: gnome-terminal
  macos:
    dialogs:
      expand_save_panel: true
      save_to_cloud: false
    dock:
      autohide: true
      mru_spaces: false
      show_recent_applications: false
    finder:
      ds_store_on_external: false
      search_scope: SCcf # default: SCev
      show_filename_extensions: true
      show_hidden_files: true
      show_path_bar: true
      show_status_bar: true
      sort_folders_first: true
      warn_on_extension_change: false
    keyboard:
      auto_substitutions: false
      initial_key_repeat: 15 # default: 25
      key_repeat: 2 # default: 6
      keyboard_navigation: true
      press_and_hold: false
    screenshots:
      location: ~/Pictures/Screenshots # default: ~/Desktop
    trackpad:
      tap_to_click: true
updates:
  packages:
    linux:
      apt: upgrade
      flatpak: true
    macos:
      homebrew:
        formulae: true
        casks: true
  tools:
    rust: true
    node: true
    python: true
    go: true
    cargo: true
    npm: true
  fonts: false
