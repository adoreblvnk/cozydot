name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: scripts/package-release.sh
      - run: |
          mkdir -p /tmp/cozydot-smoke
          tar -C /tmp/cozydot-smoke -xzf target/cozydot-0.0.1.tar.gz
          COZYDOT_ROOT=/tmp/cozydot-smoke/cozydot-0.0.1 /tmp/cozydot-smoke/cozydot-0.0.1/cozydot --list-configs
      - run: bash -n dotfiles/bash/.bashrc
