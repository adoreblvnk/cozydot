name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@v4.49.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/generate-configs.sh --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Build deterministic release
        run: |
          archive="$(COZYDOT_ARCH=amd64 scripts/package-release.sh 0.0.1 target)"
          test "$archive" = "target/cozydot-0.0.1-linux-amd64.tar.gz"
          (cd target && sha256sum -c cozydot-0.0.1-linux-amd64.tar.gz.sha256)
          test "$(tar -tzf "$archive")" = cozydot
      - name: Smoke-test installed release
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/mirror/download/v0.0.1" "$root/bin" "$root/elsewhere"
          cp target/cozydot-0.0.1-linux-amd64.tar.gz* "$root/mirror/download/v0.0.1/"
          HOME="$root/home" XDG_BIN_HOME="$root/bin" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file://$root/mirror" bash install.sh
          test ! -e "$root/config"
          test ! -e "$root/cache"
          rm -rf "$root/mirror"
          cd "$root/elsewhere"
          HOME="$root/home" XDG_CONFIG_HOME="$root/config" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file:///does/not/exist" "$root/bin/cozydot" init
          test -f "$root/config/cozydot/cozydot.yaml"
          test -f "$root/config/cozydot/dotfiles/bash/.bashrc"
          test -x "$root/config/cozydot/dotfiles/bin/.local/bin/round"
          test ! -e "$root/cache"
          "$root/bin/cozydot" --version
      - run: bash -n install.sh scripts/generate-configs.sh scripts/package-release.sh dotfiles/bash/.bashrc
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --all-targets --all-features
      - run: cargo +stable test --locked --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --locked --no-deps
