name: Rust
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@v4.49.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/generate-configs.sh --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Build deterministic release
        run: |
          archive="$(COZYDOT_ARCH=amd64 scripts/package-release.sh target)"
          test "$archive" = "target/cozydot-1.0.0-linux-amd64.tar.gz"
          (cd target && sha256sum -c cozydot-1.0.0-linux-amd64.tar.gz.sha256)
          test "$(tar -tzf "$archive")" = cozydot
      - name: Smoke-test installed release
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/mirror/download/v1.0.0" "$root/elsewhere"
          cp target/cozydot-1.0.0-linux-amd64.tar.gz* "$root/mirror/download/v1.0.0/"
          HOME="$root/home" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file://$root/mirror" bash install.sh
          binary="$root/home/.local/bin/cozydot"
          test ! -e "$root/config"
          test ! -e "$root/cache"
          rm -rf "$root/mirror"
          cd "$root/elsewhere"
          HOME="$root/home" XDG_CONFIG_HOME="$root/config" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file:///does/not/exist" "$binary" init
          test -f "$root/config/cozydot/cozydot.yaml"
          test -f "$root/config/cozydot/dotfiles/bash/.bashrc"
          test ! -e "$root/cache"
          "$binary" --version
      - run: bash -n install.sh scripts/generate-configs.sh scripts/package-release.sh dotfiles/bash/.bashrc
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: brew install gnu-tar
      - name: Build deterministic release
        run: |
          archive="$(scripts/package-release.sh target)"
          test "$archive" = "target/cozydot-1.0.0-macos-arm64.tar.gz"
          (cd target && shasum -a 256 -c cozydot-1.0.0-macos-arm64.tar.gz.sha256)
          test "$(gtar -tzf "$archive")" = cozydot
      - name: Smoke-test installed release
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/mirror/download/v1.0.0"
          cp target/cozydot-1.0.0-macos-arm64.tar.gz* "$root/mirror/download/v1.0.0/"
          HOME="$root/home" COZYDOT_RELEASE_BASE_URL="file://$root/mirror" \
            /bin/bash install.sh
          "$root/home/.local/bin/cozydot" --version | grep '1.0.0'
