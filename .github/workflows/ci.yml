name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@v4.49.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/generate-configs.sh --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Build deterministic release
        id: build
        run: |
          archive="$(scripts/package-release.sh)"
          (cd target && sha256sum -c "${archive##*/}.sha256")
          test "$(tar -tzf "$archive")" = cozydot
          echo "VERSION=$(cargo pkgid -m Cargo.toml | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"
      - name: Smoke-test installed release
        run: |
          root="$(mktemp -d)"
          VERSION="${{ steps.build.outputs.VERSION }}"
          mkdir -p "$root/mirror/download/v$VERSION" "$root/elsewhere"
          cp "target/cozydot-v$VERSION-x86_64-unknown-linux-gnu.tar.gz"* "$root/mirror/download/v$VERSION/"
          HOME="$root/home" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file://$root/mirror" bash install.sh -v "$VERSION"
          binary="$root/home/.local/bin/cozydot"
          test ! -e "$root/config"
          test ! -e "$root/cache"
          rm -rf "$root/mirror"
          cd "$root/elsewhere"
          HOME="$root/home" XDG_CONFIG_HOME="$root/config" XDG_CACHE_HOME="$root/cache" \
            COZYDOT_RELEASE_BASE_URL="file:///does/not/exist" "$binary" init
          test -f "$root/config/cozydot/cozydot.yaml"
          test -f "$root/config/cozydot/dotfiles/bash/.bashrc"
          test ! -e "$root/cache"
          "$binary" --version
      - run: bash -n install.sh scripts/generate-configs.sh scripts/package-release.sh dotfiles/bash/.bashrc
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install gnu-tar
      - name: Build deterministic release
        id: build
        run: |
          archive="$(scripts/package-release.sh)"
          (cd target && shasum -a 256 -c "${archive##*/}.sha256")
          test "$(gtar -tzf "$archive")" = cozydot
          echo "VERSION=$(cargo pkgid -m Cargo.toml | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"
      - name: Smoke-test installed release
        run: |
          root="$(mktemp -d)"
          VERSION="${{ steps.build.outputs.VERSION }}"
          mkdir -p "$root/mirror/download/v$VERSION"
          cp "target/cozydot-v$VERSION-aarch64-apple-darwin.tar.gz"* "$root/mirror/download/v$VERSION/"
          HOME="$root/home" COZYDOT_RELEASE_BASE_URL="file://$root/mirror" \
            /bin/bash install.sh -v "$VERSION"
          "$root/home/.local/bin/cozydot" --version | grep "$VERSION"
