# Synthetic parser-coverage fixture for Cozydot configuration version 1.0.0.
# This is not a recommended workstation configuration and must never become the generated default.
version: 1.0.0

system:
  require:
    distros: [ubuntu]
    desktops: [gnome]
  ensure_admin: true
  apt:
    sources:
      mode: managed
      components:
        default: [main]
    unattended_upgrades: enabled
  ubuntu:
    snap: enabled
    codecs: installed

packages:
  apt:
    remove: [conflicting-package]
    install: [curl]
    repositories:
      - name: literal-star
        key: https://packages.example.com/star-key.asc
        urls:
          default: https://packages.example.com/star/
        suite: "*"
        components: ["*"]
        packages: [star-package]

      - name: exact-path
        key: https://packages.example.com/path-key.asc
        urls:
          default: https://packages.example.com/exact/
        path: "./"
        packages: [path-package]

  flatpak: [org.gnome.Builder]
  cargo: [cargo-edit]
  npm: [example-package]

  binaries:
    - name: github-example
      format: deb
      commands: [github-example]
      source:
        provider: github
        repository: example/example
        assets:
          amd64:
            include: "example-*-amd64.deb"
            sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    - name: url-example
      format: appimage
      commands: [url-example]
      source:
        provider: url
        urls:
          amd64: https://downloads.example.com/url-example-amd64.AppImage
        sha256:
          amd64: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

tools:
  rust: nightly
  go: latest
  node: lts
  python: "3.13.5"

fonts:
  nerd: [GeistMono]

dotfiles:
  packages: [bash]

integrations:
  docker:
    add_user_to_group: true
    logging:
      driver: local
      max_size: 1g
  virtualbox:
    add_user_to_group: true
  vscode:
    extensions: [rust-lang.rust-analyzer]

desktop:
  theme: light
  terminal: github-example
  idle:
    timeout: 0s
    dim: false
  gnome:
    extensions: [example@example.com]
    dock: true
    rounded_corners: true

updates:
  apt: standard
  flatpak: true
  tools:
    rust: true
    go: true
    node: true
  packages:
    cargo: true
    npm: true
    binaries: true
  fonts: true
