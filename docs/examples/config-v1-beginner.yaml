# Beginner-friendly Cozydot configuration version 1.0.0.
version: 1.0.0

system:
  ensure_admin: true
  apt:
    sources:
      mode: preserve
    unattended_upgrades: enabled

packages:
  apt:
    install:
      - curl
      - git
      - vim
  flatpak:
    - com.bitwarden.desktop
    - com.discordapp.Discord
  cargo:
    - bat
    - starship

tools:
  rust: stable
  node: lts
  python: "3.13"

fonts:
  nerd:
    - GeistMono

dotfiles:
  packages:
    - bash
    - bat
    - starship

updates:
  apt: standard
  flatpak: true
  tools:
    rust: true
    node: true
  packages:
    cargo: true
  fonts: true
